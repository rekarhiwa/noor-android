plugins {
    id 'com.android.application'
}

android {
    compileSdk 36

    defaultConfig {
        applicationId "com.dya.noor"
        minSdk 26
        targetSdk 36
        versionCode 47
        versionName "5.3.6.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk.debugSymbolLevel = "FULL"
        }
        buildFeatures {
            viewBinding
        }
    }


    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
  //  buildToolsVersion '30.0.3'
    namespace 'com.dya.noor'
    buildFeatures {
        viewBinding true
    }
    ndkVersion "26.1.10909125"

}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'

    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.firebase:firebase-messaging:25.1.3'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.firebase:firebase-database:22.0.2'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.gms:play-services-maps:20.0.0'

    implementation 'com.codesgood:justifiedtextview:2.0.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.airbnb.android:lottie:6.7.1'


    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.makeramen:roundedimageview:2.3.0'

    implementation 'androidx.browser:browser:1.10.0'

    // pdf lib
   // implementation 'com.pspdfkit:android-pdf-viewer:3.7.1'
    implementation "com.github.msarhan:ummalqura-calendar:2.0.2"

    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.intuit.sdp:sdp-android:1.1.1'

    implementation 'com.github.bumptech.glide:glide:5.0.7' // Replace with your desired version
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.7'



}
apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}